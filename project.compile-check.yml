# Model-free overlay used only by the lightweight unsigned compile check.
# The full project.yml intentionally requires the exported model and manifest.
include:
  - path: project.yml
    relativePaths: false

targets:
  GolfBallFinder:
    sources:REPLACE:
      - path: GolfBallFinder
        excludes:
          - Resources
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: GolfBallFinder/PrivacyInfo.xcprivacy
        buildPhase: resources
