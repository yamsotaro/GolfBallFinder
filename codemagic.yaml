workflows:
  ios-compile-check:
    name: iOS unsigned compile check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          xcodegen generate --spec project.compile-check.yml
      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project GolfBallFinder.xcodeproj \
            -scheme GolfBallFinder
      - name: Run unit tests on an available iPhone simulator
        script: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [device for runtime in data["devices"].values() for device in runtime if device.get("isAvailable") and "iPhone" in device.get("name", "")]
          selected = next((device for device in devices if device["name"] == "iPhone 16 Pro"), devices[0] if devices else None)
          if selected is None:
              raise SystemExit("No available iPhone simulator")
          print(selected["udid"])
          ')"
          xcodebuild test \
            -project GolfBallFinder.xcodeproj \
            -scheme GolfBallFinder \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Compile for iOS Simulator without signing
        script: |
          set -euo pipefail
          xcodebuild build \
            -project GolfBallFinder.xcodeproj \
            -scheme GolfBallFinder \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

  ios-model-compile-check:
    name: iOS seed model export and unsigned compile check
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install deterministic build tools
        script: |
          set -euo pipefail
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list python@3.11 >/dev/null 2>&1 || brew install python@3.11
          xcodegen --version

      - name: Fetch SHA256-pinned seed checkpoint
        script: |
          set -euo pipefail
          export YOLO_CONFIG_DIR="$CM_BUILD_DIR/.cache/ultralytics"
          export HF_HOME="$CM_BUILD_DIR/.cache/huggingface"
          mkdir -p "$YOLO_CONFIG_DIR" "$HF_HOME"
          /opt/homebrew/bin/python3.11 -m venv .venv-model-ci
          . .venv-model-ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r training/requirements.txt
          python scripts/fetch_seed_model.py
          python -c '
          from pathlib import Path
          from scripts.fetch_seed_model import EXPECTED_SHA256, sha256
          model = Path("training/models/seed_golf_ball_yolov8n.pt")
          actual = sha256(model)
          assert actual == EXPECTED_SHA256, (EXPECTED_SHA256, actual)
          print(f"Verified seed SHA256: {actual}")
          '

      - name: Export and validate GolfBall.mlpackage
        script: |
          set -euo pipefail
          . .venv-model-ci/bin/activate
          python training/export_coreml.py \
            --weights training/models/seed_golf_ball_yolov8n.pt
          python -c '
          import json
          from pathlib import Path
          from scripts.fetch_seed_model import EXPECTED_SHA256
          package = Path("GolfBallFinder/Resources/GolfBall.mlpackage")
          manifest_path = Path("GolfBallFinder/Resources/ModelManifest.json")
          assert manifest_path.is_file(), f"Generated model manifest is missing: {manifest_path}"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert package.is_dir(), package
          assert (package / "Manifest.json").is_file(), "Core ML package Manifest.json is missing"
          assert manifest["checkpoint_sha256"] == EXPECTED_SHA256, manifest
          assert manifest["model_resource"] == "GolfBall.mlpackage", manifest
          print(f"Verified generated manifest: {manifest_path.resolve()}")
          print(json.dumps(manifest, indent=2))
          '

      - name: Generate project, verify model registration, and resolve packages
        script: |
          set -euo pipefail
          xcodegen generate
          PBXPROJ="GolfBallFinder.xcodeproj/project.pbxproj"
          test -f "$PBXPROJ" || { echo "Generated project.pbxproj is missing"; exit 3; }
          echo "PBXFileReference/PBXBuildFile/PBXSourcesBuildPhase/PBXResourcesBuildPhase diagnostics:"
          grep -nE "GolfBall.mlpackage|ModelManifest.json|PrivacyInfo.xcprivacy" "$PBXPROJ" || true
          python3 scripts/validate_xcode_model_registration.py \
            --pbxproj "$PBXPROJ" \
            --target GolfBallFinder \
            --model GolfBall.mlpackage \
            --resource ModelManifest.json \
            --resource PrivacyInfo.xcprivacy \
            --runtime-config GolfBallFinder/AppConfig.swift
          xcodebuild -resolvePackageDependencies \
            -project GolfBallFinder.xcodeproj \
            -scheme GolfBallFinder

      - name: Run simulator unit tests with the real model resource
        script: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [device for runtime in data["devices"].values() for device in runtime if device.get("isAvailable") and "iPhone" in device.get("name", "")]
          selected = next((device for device in devices if device["name"] == "iPhone 16 Pro"), devices[0] if devices else None)
          if selected is None:
              raise SystemExit("No available iPhone simulator")
          print(selected["udid"])
          ')"
          xcodebuild test \
            -project GolfBallFinder.xcodeproj \
            -scheme GolfBallFinder \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/model-test-derived \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and verify compiled Core ML bundle resource
        script: |
          set -euo pipefail
          mkdir -p build/logs
          BUILD_LOG="build/logs/model-xcodebuild.log"
          xcodebuild clean build \
            -project GolfBallFinder.xcodeproj \
            -scheme GolfBallFinder \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/model-compile-derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$BUILD_LOG"
          echo "Core ML compiler operations in the clean build log:"
          if ! grep -nE "coremlcompiler|/coremlc|CoreMLModelCompile|CompileMLModel|CoreMLModelCodegen" "$BUILD_LOG"; then
            echo "No Core ML model compilation operation was found in the Xcode build log"
            exit 7
          fi
          echo "All compiled Core ML model directories in build products:"
          find build/model-compile-derived/Build/Products -type d -name '*.mlmodelc' -print
          APP_PATH="$(find build/model-compile-derived/Build/Products -type d -name GolfBallFinder.app -print -quit)"
          test -n "$APP_PATH" || { echo "Built simulator app was not found"; exit 4; }
          echo "All compiled Core ML model directories in app bundle:"
          find "$APP_PATH" -type d -name '*.mlmodelc' -print
          MODEL_PATH="$(find "$APP_PATH" -type d -name GolfBall.mlmodelc -print -quit)"
          test -n "$MODEL_PATH" || { echo "Compiled GolfBall.mlmodelc is missing from app bundle"; exit 5; }
          echo "All JSON files in app bundle:"
          find "$APP_PATH" -type f -name '*.json' -print
          test -f "$APP_PATH/ModelManifest.json" || { echo "ModelManifest.json is missing from app bundle"; exit 6; }
          echo "Verified bundled model: $MODEL_PATH"

    artifacts:
      - build/model-compile-derived/Build/Products/Debug-iphonesimulator/GolfBallFinder.app
      - build/logs/model-xcodebuild.log
      - GolfBallFinder.xcodeproj/project.pbxproj
      - GolfBallFinder/Resources/ModelManifest.json
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iPhone TestFlight build
    max_build_duration: 120
    instance_type: mac_mini_m2

    # This is the exact App Store Connect API key name already configured in
    # Codemagic > Team settings > Developer Portal.
    integrations:
      app_store_connect: "GolfBallFinder Codemagic"

    environment:
      # Codemagic fetches the matching Apple Distribution certificate and App
      # Store provisioning profile from Team > Code signing identities.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yamsotaro.golfballfinder
      # Create this group with the non-secret numeric APP_STORE_APPLE_ID from
      # App Store Connect > General > App Information > Apple ID. API key
      # credentials remain exclusively in the Developer Portal integration.
      groups:
        - golfballfinder_config
      vars:
        BUNDLE_ID: com.yamsotaro.golfballfinder
      xcode: latest

    scripts:
      - name: Validate cloud configuration
        script: |
          set -euo pipefail
          test "$BUNDLE_ID" = "com.yamsotaro.golfballfinder" || {
            echo "Release Bundle ID mismatch: expected com.yamsotaro.golfballfinder, got $BUNDLE_ID"
            exit 2
          }
          case "${APP_STORE_APPLE_ID:-}" in
            ''|*[!0-9]*)
              echo "APP_STORE_APPLE_ID must be the numeric Apple ID in group golfballfinder_config"
              exit 2
              ;;
          esac
          echo "Building bundle id: $BUNDLE_ID"

      - name: Select next App Store Connect build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-build-number \
            --platform IOS \
            --all-versions \
            "$APP_STORE_APPLE_ID")"
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            LATEST_BUILD_NUMBER=0
          fi
          case "$LATEST_BUILD_NUMBER" in
            *[!0-9]*)
              echo "Unexpected latest App Store Connect build number: $LATEST_BUILD_NUMBER"
              exit 2
              ;;
          esac
          NEXT_BUILD_NUMBER="$((LATEST_BUILD_NUMBER + 1))"
          APP_BUILD_NUMBER="$NEXT_BUILD_NUMBER"
          echo "APP_BUILD_NUMBER=$APP_BUILD_NUMBER" >> "$CM_ENV"
          echo "Latest uploaded build: $LATEST_BUILD_NUMBER"
          echo "Selected build number: $APP_BUILD_NUMBER"

      - name: Install XcodeGen and Python 3.11
        script: |
          set -euo pipefail
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list python@3.11 >/dev/null 2>&1 || brew install python@3.11
          xcodegen --version

      - name: Configure bundle identifier
        script: |
          set -euo pipefail
          python3 scripts/configure_bundle_id.py \
            --bundle-id "$BUNDLE_ID" \
            --build-number "$APP_BUILD_NUMBER"

      - name: Prepare seed Core ML model if no model is committed
        script: |
          set -euo pipefail
          export YOLO_CONFIG_DIR="$CM_BUILD_DIR/.cache/ultralytics"
          export HF_HOME="$CM_BUILD_DIR/.cache/huggingface"
          mkdir -p "$YOLO_CONFIG_DIR" "$HF_HOME"
          if [ ! -d GolfBallFinder/Resources/GolfBall.mlpackage ]; then
            /opt/homebrew/bin/python3.11 -m venv .venv-ci
            . .venv-ci/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r training/requirements.txt
            python scripts/fetch_seed_model.py
            python training/export_coreml.py \
              --weights training/models/seed_golf_ball_yolov8n.pt
          else
            echo "Using committed GolfBall.mlpackage"
            test -f GolfBallFinder/Resources/ModelManifest.json || {
              echo "Committed GolfBall.mlpackage requires GolfBallFinder/Resources/ModelManifest.json"
              exit 3
            }
          fi

      - name: Generate Xcode project
        script: |
          set -euo pipefail
          xcodegen generate
          if grep -R -n "dev\.local\.GolfBallFinder" \
            project.yml GolfBallFinder.xcodeproj GolfBallFinder/Info.plist; then
            echo "Development Bundle ID leaked into the generated release project"
            exit 4
          fi
          python3 scripts/validate_xcode_model_registration.py \
            --pbxproj GolfBallFinder.xcodeproj/project.pbxproj \
            --target GolfBallFinder \
            --model GolfBall.mlpackage \
            --resource ModelManifest.json \
            --resource PrivacyInfo.xcprivacy \
            --runtime-config GolfBallFinder/AppConfig.swift

      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project GolfBallFinder.xcodeproj \
            -scheme GolfBallFinder

      - name: Verify generated release identifiers
        script: |
          set -euo pipefail
          BUILD_SETTINGS="$(xcodebuild -showBuildSettings \
            -project GolfBallFinder.xcodeproj \
            -target GolfBallFinder \
            -configuration Release)"
          GENERATED_BUNDLE_ID="$(printf '%s\n' "$BUILD_SETTINGS" | \
            awk -F ' = ' '/^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = / { print $2; exit }')"
          GENERATED_BUILD_NUMBER="$(printf '%s\n' "$BUILD_SETTINGS" | \
            awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / { print $2; exit }')"
          test "$GENERATED_BUNDLE_ID" = "$BUNDLE_ID" || {
            echo "Release Bundle ID mismatch in generated build settings: $GENERATED_BUNDLE_ID"
            exit 4
          }
          test "$GENERATED_BUILD_NUMBER" = "$APP_BUILD_NUMBER" || {
            echo "Release build number mismatch in generated build settings: $GENERATED_BUILD_NUMBER"
            exit 4
          }
          PLIST_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' GolfBallFinder/Info.plist)"
          test "$PLIST_BUNDLE_ID" = '$(PRODUCT_BUNDLE_IDENTIFIER)' || {
            echo "Generated Info.plist does not defer CFBundleIdentifier to PRODUCT_BUNDLE_IDENTIFIER"
            exit 4
          }
          echo "Verified generated release identifiers: $GENERATED_BUNDLE_ID ($GENERATED_BUILD_NUMBER)"

      - name: Run unit tests on an available iPhone simulator
        script: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [device for runtime in data["devices"].values() for device in runtime if device.get("isAvailable") and "iPhone" in device.get("name", "")]
          selected = next((device for device in devices if device["name"] == "iPhone 16 Pro"), devices[0] if devices else None)
          if selected is None:
              raise SystemExit("No available iPhone simulator")
          print(selected["udid"])
          ')"
          xcodebuild test \
            -project GolfBallFinder.xcodeproj \
            -scheme GolfBallFinder \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Apply provisioning profiles
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/GolfBallFinder.xcodeproj"

      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/GolfBallFinder.xcodeproj" \
            --scheme GolfBallFinder

      - name: Verify signed IPA identifiers and compiled model
        script: |
          set -euo pipefail
          IPA_PATH="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH" || { echo "Signed IPA was not produced"; exit 5; }
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -mindepth 1 -maxdepth 1 \
            -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH" || { echo "Application bundle is missing from IPA"; exit 5; }

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          IPA_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          IPA_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          test "$IPA_BUNDLE_ID" = "$BUNDLE_ID" || {
            echo "Signed IPA Bundle ID mismatch: $IPA_BUNDLE_ID"
            exit 5
          }
          test "$IPA_BUILD_NUMBER" = "$APP_BUILD_NUMBER" || {
            echo "Signed IPA build number mismatch: $IPA_BUILD_NUMBER"
            exit 5
          }
          if grep -R -a -q "dev\.local\.GolfBallFinder" "$APP_PATH"; then
            echo "Development Bundle ID is present in the signed application bundle"
            exit 5
          fi

          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$VERIFY_DIR/profile.plist"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' "$VERIFY_DIR/profile.plist")"
          case "$PROFILE_APP_ID" in
            *."$BUNDLE_ID") ;;
            *)
              echo "Provisioning profile does not match $BUNDLE_ID: $PROFILE_APP_ID"
              exit 5
              ;;
          esac
          SIGNING_AUTHORITY="$(codesign -dvv "$APP_PATH" 2>&1 | \
            sed -n 's/^Authority=//p' | head -n 1)"
          case "$SIGNING_AUTHORITY" in
            "Apple Distribution:"*|"iPhone Distribution:"*) ;;
            *)
              echo "Unexpected distribution signing authority: $SIGNING_AUTHORITY"
              exit 5
              ;;
          esac

          MODEL_PATH="$(find "$APP_PATH" -type d -name GolfBall.mlmodelc -print -quit)"
          test -n "$MODEL_PATH" || { echo "GolfBall.mlmodelc is missing from signed IPA"; exit 5; }
          test -f "$APP_PATH/ModelManifest.json" || {
            echo "ModelManifest.json is missing from signed IPA"
            exit 5
          }
          echo "Verified signed IPA: $IPA_BUNDLE_ID ($IPA_BUILD_NUMBER)"
          echo "Verified provisioning profile: $PROFILE_APP_ID"
          echo "Verified signing authority: $SIGNING_AUTHORITY"
          echo "Verified compiled model: $MODEL_PATH"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
