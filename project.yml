name: GolfBallFinder
options:
  # XcodeGen 2.38.0 made .mlpackage a source type so Xcode invokes the
  # Core ML compiler instead of copying the package as an ordinary resource.
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  UltralyticsYOLO:
    url: https://github.com/ultralytics/yolo-ios-app.git
    exactVersion: 8.9.13

targets:
  GolfBallFinder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfBallFinder
        excludes:
          - Resources
          - Info.plist
          - PrivacyInfo.xcprivacy
      # Keep this in Sources. XcodeGen recognizes .mlpackage as a Core ML
      # source and adds it to PBXSourcesBuildPhase, which produces .mlmodelc.
      - path: GolfBallFinder/Resources/GolfBall.mlpackage
        buildPhase: sources
      - path: GolfBallFinder/Resources/ModelManifest.json
        buildPhase: resources
      - path: GolfBallFinder/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: UltralyticsYOLO
        product: UltralyticsYOLO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.GolfBallFinder
        PRODUCT_NAME: GolfBallFinder
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: GolfBallFinder/Info.plist
      properties:
        CFBundleDisplayName: Golf Ball Finder
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: ゴルフボールを探すためにカメラ映像を端末内で解析します。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true

  GolfBallFinderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/GolfBallFinderTests
    dependencies:
      - target: GolfBallFinder
    settings:
      base:
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GolfBallFinder:
    build:
      targets:
        GolfBallFinder: all
        GolfBallFinderTests: [test]
    test:
      targets:
        - GolfBallFinderTests
